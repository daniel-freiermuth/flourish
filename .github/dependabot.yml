# Keeps the SHA-pinned actions in .github/workflows/ from silently aging
# onto a runtime GitHub has removed (checkout/setup-node sat on node20 past
# its 2026-09-23 removal). Dependabot bumps the SHA and rewrites the
# trailing `# vX.Y.Z` comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
