name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Rust backend (hunter-rs/) ──────────────────────────────────
  rust:
    name: Rust — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hunter-rs

      # No dev.db step: build.rs regenerates it from migrations/ on every
      # build, which is what sqlx::query! validates against.
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # `--all-targets` builds the tests, whose self dev-dependency turns
      # on `test-support` for the whole build. This pass compiles the
      # library and binaries without it, so production code cannot reach
      # the fixture-only API (`Unreconciled::assume_clean`,
      # `Store::recovered`, `RunningJob::disown`, ...).
      - name: Clippy (production build, no test-support)
        run: cargo clippy --lib --bins -- -D warnings

      # Same script `just lint` runs locally — `just` itself is not
      # installed in this job, so both call the script rather than CI
      # re-implementing the rules.
      - name: SQL encapsulation
        run: ./check-sql.sh

      - name: Git encapsulation
        run: ./check-git.sh

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.115

      - name: Test
        run: cargo nextest run --profile ci

      # Same two commands as `just bindings`. The UI's API types are
      # generated from src/types.rs and committed, so the frontend job
      # typechecks against whatever was committed -- this is what makes
      # that the current Rust shape rather than the last one someone
      # remembered to regenerate.
      - name: TypeScript bindings are current
        run: |
          rm -rf ../hunter/ui-svelte/src/lib/generated
          cargo test --quiet --lib export_bindings
          changes=$(git status --porcelain -- ../hunter/ui-svelte/src/lib/generated)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::hunter/ui-svelte/src/lib/generated is stale: run 'just bindings' in hunter-rs/ and commit the result"
            exit 1
          fi

  # ── Line coverage ─────────────────────────────────────────────
  # A ratchet, not a target. The floor sits just under the current
  # number so an unrelated change cannot drift it downward unnoticed;
  # raise it when a module gets covered, never lower it to go green.
  #
  # Coverage and mutation testing answer different questions and are
  # both needed: coverage says whether a line RUNS, mutants says whether
  # anything NOTICES when it changes. A module can score 90% coverage
  # and still lose every mutant. Coverage is also what says where
  # running mutants is worthwhile at all — mutating code no test
  # executes just reports "untested" slowly.
  #
  # Mutation testing lives in its own workflow (mutants.yml) so its
  # findings get a run of their own to read, rather than one row inside
  # this one.
  coverage:
    name: Rust — line coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hunter-rs

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.115,cargo-llvm-cov@0.6.23

      - name: Coverage
        run: cargo llvm-cov nextest --profile ci --summary-only --fail-under-lines 50


  # ── Svelte frontend (hunter/ui-svelte/) ────────────────────────
  frontend:
    name: Frontend — lint + typecheck + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hunter/ui-svelte
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hunter/ui-svelte/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npx eslint src/

      # `npm run check`, never bare `svelte-check`: the script is
      # `svelte-check --tsconfig ./tsconfig.app.json && tsc -p
      # tsconfig.node.json`, and running only the first half leaves
      # vite.config.ts untypechecked. Bare svelte-check is also how a
      # weaker default config got used locally for several rounds --
      # 104 files where the project config covers 127 -- reporting a
      # clean tree for errors CI then failed on.
      - name: Svelte check
        run: npm run check

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build
