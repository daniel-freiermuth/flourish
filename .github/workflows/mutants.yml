name: Mutants

# Its own workflow, not a job inside CI: as a job it appeared only as one
# row of the CI run, and the GitHub UI gives a sub-job no place to show a
# long list of surviving mutants. A separate workflow gets its own run,
# its own log, and its own history to compare against.
#
# A GATE: a mutant the diff introduces that the suite does not catch fails
# the run. A survivor means the suite cannot tell the new code from a
# broken version of it, so the PR either adds the missing test or removes
# the code nothing depends on. The single check to require for merging is
# "Mutation coverage of the diff" (the `gate` job below).

# PR-only: the scope is the PR's diff against its base branch, which a
# push event does not have (github.base_ref is empty there).
on:
  pull_request:

# Deliberately NOT sharing CI's concurrency group: a mutation run takes
# far longer than the rest of CI, and cancelling it on every push is how
# it ended up never finishing. It still cancels its own older runs.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Plan ──────────────────────────────────────────────────────
  # Tests the mutants a change introduces, not the whole tree. Scope is
  # "lines in the diff" plus, for any function the diff touches, the
  # mutant that replaces that whole function -- so a one-line change
  # inside a large function is audited as the whole function, which is
  # the point rather than a leak.
  #
  # A gate has to test every mutant of the diff, on every push. A large
  # diff is therefore split into shards that run in parallel (the matrix
  # below), each small enough to finish inside its time cap; the earlier
  # advisory version ran one rotating shard per push instead, which is
  # fine for a report and useless for a gate.
  plan:
    name: Plan mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    defaults:
      run:
        working-directory: hunter-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: hunter-rs

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-mutants@27.1.0

      - name: List the mutants this PR introduces
        id: plan
        env:
          # Mutants per shard. At -j 2 on a hosted runner a mutant costs
          # about 30 s (48 mutants took 25 min on PR #69), so 40 fits the
          # 35-minute cap in the shard job with room for the baseline.
          MAX_MUTANTS: "40"
          BASE_REF: ${{ github.base_ref }}
        run: |
          # --relative is load-bearing: without it git emits repo-relative
          # paths (a/hunter-rs/src/...) while cargo-mutants runs inside the
          # package and matches on src/..., so every mutant is filtered out
          # and the job passes having tested nothing.
          git diff --no-color --relative "origin/$BASE_REF"...HEAD -- . > /tmp/pr.diff

          # Check the exit status: a failed --list is otherwise
          # indistinguishable from an empty one, and the gate would pass on
          # a count of 0 having tested nothing.
          if ! cargo mutants --in-diff /tmp/pr.diff --list > /tmp/mutants.list; then
            echo "::error::cargo mutants --list failed; see the output above."
            exit 1
          fi
          count=$(wc -l < /tmp/mutants.list)
          shards=$(( (count + MAX_MUTANTS - 1) / MAX_MUTANTS ))
          echo "diff introduces $count mutants: $shards shard(s) of at most $MAX_MUTANTS"
          if [ "$count" -eq 0 ]; then
            echo "::notice::No mutable code in this diff."
          fi
          # JSON array of zero-based shard indexes, [] for no mutants.
          echo "shards=[$(seq -s, 0 $(( shards - 1 )))]" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shards" >> "$GITHUB_OUTPUT"

  # ── Shards ────────────────────────────────────────────────────
  mutants:
    name: Mutants shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # Above the step's own 35-minute cap: a job timeout cancels the run,
    # and the step must be the one to report what happened.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        working-directory: hunter-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: hunter-rs

      # No dev.db step: build.rs regenerates it from migrations/ on every
      # build, which is what sqlx::query! validates against.
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-nextest@0.9.115,cargo-mutants@27.1.0

      - name: Mutants introduced by this PR
        # The script classifies cargo-mutants' exit code (mutants.rs/
        # exit-codes) instead of letting any failure pass:
        #   0      every mutant caught -> pass
        #   2      surviving mutants   -> fail, the point of the gate
        #   3      mutant timeouts     -> fail: a mutant the suite does not
        #          finish on is not shown to be caught
        #   124    the 35-minute cap   -> fail: part of the shard is untested
        #   1, 4   usage error / baseline failed -> fail: nothing was tested
        #          (a broken baseline is usually a test reading a file
        #          outside hunter-rs/, which cargo-mutants does not copy;
        #          exclude it in .cargo/mutants.toml)
        #
        # --minimum-test-timeout guards the timeout case against load: the
        # auto timeout is derived from one baseline run, and at -j 2 a
        # caught mutant has been seen to overrun it.
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shard_count }}
        run: |
          git diff --no-color --relative "origin/$BASE_REF"...HEAD -- . > /tmp/pr.diff
          set +e
          timeout 35m cargo mutants --test-tool nextest \
            --in-diff /tmp/pr.diff -j 2 --colors never \
            --minimum-test-timeout 120 \
            --shard "$SHARD/$SHARDS"
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::every mutant in shard $SHARD was caught." ;;
            2) echo "::error::surviving mutants: add the missing tests, or"\
                    "remove the code nothing notices. See MISSED above." ;;
            3) echo "::error::mutants timed out; see TIMEOUT above." ;;
            124) echo "::error::hit the 35m cap; part of shard $SHARD is untested." ;;
            4) echo "::error::baseline failed -- the suite is red before any"\
                    "mutation, so NOTHING was tested." ;;
            *) echo "::error::cargo mutants exited $rc (usage or internal"\
                    "error); nothing was tested." ;;
          esac
          exit "$rc"

  # ── Gate ──────────────────────────────────────────────────────
  # One stable check name to require for merging, whatever the number of
  # shards. It runs even when the matrix was skipped (no mutants) or a
  # shard failed, and passes only if the plan succeeded and every shard
  # that ran did.
  gate:
    name: Mutation coverage of the diff
    needs: [plan, mutants]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every mutant of the diff is caught
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.mutants.result }}
        run: |
          echo "plan: $PLAN, shards: $SHARDS"
          if [ "$PLAN" != success ]; then
            echo "::error::planning the mutation run failed."
            exit 1
          fi
          # `skipped` only when the plan found no mutants.
          case "$SHARDS" in
            success|skipped) exit 0 ;;
            *) echo "::error::a mutation shard did not pass."; exit 1 ;;
          esac
