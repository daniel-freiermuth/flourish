# cargo-mutants configuration.
#
# A full run is ~1900 mutants and takes hours, so it is not a per-push
# gate. Two ways to use it:
#
#   cargo mutants --test-tool nextest -j 4 --file src/<module>.rs
#       Focused audit of one module. This is the useful one.
#
#   cargo mutants --test-tool nextest \
#       --in-diff <(git diff --relative <remote>/master...HEAD -- .)
#       Only the mutants your change introduces. Cheap enough for CI on
#       a pull request.
#
#       `--relative` is load-bearing. Run from this directory, git writes
#       paths as `a/hunter-rs/src/...` while cargo-mutants matches on
#       `src/...`, so every mutant is filtered out and the run reports
#       "No mutants to filter" -- which reads exactly like a clean audit.
#       Verified: without it, `--list` prints nothing; with it, the same
#       diff lists mutants. `.github/workflows/mutants.yml` says the same
#       at its call site.
#
#       `<remote>` is `origin` on CI (actions/checkout names it that) but
#       whatever you cloned with locally -- there is no `origin` in a
#       working copy that was set up with a named remote, and the
#       resulting "unknown revision" is a confusingly indirect way to
#       arrive at an empty diff.
#
# What a surviving mutant means: the test suite cannot tell the mutated
# code from the real code. Sometimes that is a missing test, sometimes
# the mutant is genuinely equivalent — in which case the honest fix is
# usually to delete the redundant code that made it equivalent, not to
# add a test that cannot exist. Both happened on the first run here.

# Three tests read files OUTSIDE this crate, and cargo-mutants copies the
# crate only: `playbook_contract_test` renders the REAL playbooks in
# ../hunter, `ui_contract_test` reads the REAL ../hunter/ui-svelte
# sources, and `gates_contract_test` reads ../.github/workflows/ci.yml.
# Left in, they fail against the copied tree, and because that failure
# lands in the BASELINE the whole run stops having mutated anything --
# `*** result: Failure(100)` with the real message (`cannot read
# /tmp/cargo-mutants-….tmp/../…`) buried hundreds of lines up. All three
# are contract tests between two directories rather than unit tests, so
# excluding them costs no mutation signal.
#
# Adding a test that reads a sibling directory means adding it here too.
# That is not a rule anything enforces: mutants is a separate advisory
# workflow, so CI stays green and only the mutants run goes red.
# Named here, not only on the command line: `-E` below is a nextest
# filter expression, so a plain `cargo mutants` would hand it to
# `cargo test`, which does not understand it -- the baseline fails and
# nothing is ever mutated. The tool and the filter that depends on it
# have to travel together.
test_tool = "nextest"

additional_cargo_test_args = [
    "-E",
    "not binary(playbook_contract_test) and not binary(ui_contract_test) and not binary(gates_contract_test)",
]

timeout_multiplier = 3.0
minimum_test_timeout = 20

# Excluded because mutating them produces noise rather than signal:
exclude_globs = [
    # Generated at build time; not hand-written logic.
    "build.rs",
    # Argument parsing with a single caller (the systemd unit). Mutants
    # here are all "accepts a flag it should reject", which the usage
    # string already documents and no test should be pinned to.
    "src/main.rs",
]

# Trait method bodies that only forward, and Display impls, generate
# mutants whose "correct" behaviour is untestable in isolation.
#
# Matched against the names cargo-mutants gives them, which spell the
# trait as written (`<impl std::fmt::Display for JobStart>::fmt`) and
# never contain `fn`: the `impl Display` and `fn fmt` this list held
# before matched no mutant at all (`cargo mutants --list` showed them).
exclude_re = [
    "<impl (std::)?(fmt::)?Display for [^>]+>::fmt ",
    # The match guard in `sweep_workspaces` only decides whether a pass
    # is worth a log line: both arms have already swept, so forcing the
    # guard either way or inverting it changes what is logged and
    # nothing else. Whether the daemon sweeps at all is tested
    # (`daemon_test`), and that mutant is not excluded.
    "(match guard .*|replace != with ==) in sweep_workspaces",
    # `OverdriveBackend` only changes `decide`; every other method forwards
    # to the provider backend verbatim. `decide` is not excluded.
    "<impl Backend for OverdriveBackend>::(keep_fresh|status_html|run) ",
]
